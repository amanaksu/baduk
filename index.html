<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1a14">
<title>웹 바둑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23dcb35c'/%3E%3Ccircle cx='11' cy='12' r='7' fill='%23111'/%3E%3Ccircle cx='21' cy='20' r='7' fill='%23fff' stroke='%23999'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4efe6; --panel:#fffaf1; --text:#2b2218; --muted:#7a6a55; --line:#e3d7c2;
    --accent:#b5651d; --accent-text:#fff; --btn:#efe5d3; --btn-text:#2b2218;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17130f; --panel:#221c16; --text:#efe6d8; --muted:#a8977f; --line:#3a3026;
      --accent:#d98a3d; --accent-text:#1a120a; --btn:#2f271f; --btn-text:#efe6d8;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
  header h1{font-size:20px;margin:0;letter-spacing:-.02em}
  header .sub{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
  main{width:100%;max-width:760px;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  #status{width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .player{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel);
    border:2px solid transparent;min-width:0;transition:border-color .2s}
  .player.active{border-color:var(--accent)}
  #pW{justify-content:flex-end;text-align:right}
  .dot{width:18px;height:18px;border-radius:50%;flex:none}
  .dot.b{background:radial-gradient(circle at 35% 35%,#666,#111)}
  .dot.w{background:radial-gradient(circle at 35% 35%,#fff,#cfcfcf);border:1px solid #999}
  .pinfo{display:flex;flex-direction:column;min-width:0}
  .pname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caps{font-size:12px;color:var(--muted)}
  #msgBox{text-align:center;font-size:13px;line-height:1.35;min-width:96px}
  #msg{font-weight:600}
  #sub{color:var(--muted);font-size:12px;min-height:16px}
  #boardWrap{width:min(100%, calc(100dvh - 230px));min-width:260px;aspect-ratio:1/1;position:relative}
  canvas{display:block;width:100%;border-radius:6px;touch-action:manipulation;
    box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:560px}
  button{font:inherit;font-size:15px;padding:11px 8px;border-radius:10px;border:none;background:var(--btn);color:var(--btn-text);cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);color:var(--accent-text);font-weight:600}
  button.ghost{background:transparent;border:1px solid var(--line);padding:7px 12px;font-size:14px}
  #scorePanel{width:100%;max-width:560px;background:var(--panel);border-radius:12px;padding:12px 14px;font-size:14px}
  #scorePanel p{margin:0 0 8px;color:var(--muted);font-size:13px}
  #scoreText{line-height:1.6;margin-bottom:10px}
  #scoreText b{font-size:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  dialog{border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--text);width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog form{padding:18px}
  dialog h2{margin:0 0 12px;font-size:18px}
  .field{margin-bottom:14px}
  .field>label.t{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg label{flex:1;min-width:64px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;background:var(--btn);font-size:14px;cursor:pointer}
  .seg input:checked+span{background:var(--accent);color:var(--accent-text);font-weight:600}
  .seg input:disabled+span{opacity:.4}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(20,16,12,.92);color:#fff;
    padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:420px){ .pname{font-size:13px} #msgBox{min-width:80px} button{font-size:14px} }
</style>
</head>
<body>
<header>
  <h1>바둑<span class="sub" id="modeLabel"></span></h1>
  <button class="ghost" id="btnSettings" type="button">⚙ 설정</button>
</header>
<main>
  <section id="status">
    <div class="player" id="pB"><span class="dot b"></span><div class="pinfo"><span class="pname" id="nameB">흑</span><span class="caps">따낸 돌 <b id="capB">0</b></span></div></div>
    <div id="msgBox"><div id="msg">흑 차례</div><div id="sub"></div></div>
    <div class="player" id="pW"><div class="pinfo"><span class="pname" id="nameW">백</span><span class="caps">따낸 돌 <b id="capW">0</b></span></div><span class="dot w"></span></div>
  </section>
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <section id="controls">
    <button id="btnPass" type="button">패스</button>
    <button id="btnUndo" type="button">무르기</button>
    <button id="btnResign" type="button">기권</button>
    <button id="btnNew" type="button" class="primary">새 게임</button>
  </section>
  <section id="scorePanel" hidden>
    <p>계가 중입니다. 판단이 틀린 사석은 돌을 탭해서 바꿀 수 있어요.</p>
    <div id="scoreText"></div>
    <div class="row2">
      <button id="btnResume" type="button">계속 두기</button>
      <button id="btnConfirm" type="button" class="primary">계가 확정</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <h2>새 게임 설정</h2>
    <div class="field">
      <label class="t">모드</label>
      <div class="seg">
        <label><input type="radio" name="mode" value="ai"><span>AI 대국</span></label>
        <label><input type="radio" name="mode" value="pvp"><span>2인 대전</span></label>
      </div>
    </div>
    <div class="field" id="fLevel">
      <label class="t">AI 난이도</label>
      <div class="seg">
        <label><input type="radio" name="level" value="easy"><span>쉬움</span></label>
        <label><input type="radio" name="level" value="normal"><span>보통</span></label>
        <label><input type="radio" name="level" value="hard"><span>어려움</span></label>
        <label><input type="radio" name="level" value="vhard"><span>매우 어려움</span></label>
      </div>
    </div>
    <div class="field" id="fColor">
      <label class="t">내 돌</label>
      <div class="seg">
        <label><input type="radio" name="human" value="1"><span>흑 (먼저)</span></label>
        <label><input type="radio" name="human" value="2"><span>백 (나중)</span></label>
      </div>
    </div>
    <div class="field">
      <label class="t">판 크기</label>
      <div class="seg">
        <label><input type="radio" name="n" value="9"><span>9×9</span></label>
        <label><input type="radio" name="n" value="13"><span>13×13</span></label>
        <label><input type="radio" name="n" value="19"><span>19×19</span></label>
      </div>
      <p class="hint">AI는 9×9에서 가장 강하고, 19×19에서는 생각 시간이 더 걸려요.</p>
    </div>
    <div class="field">
      <label class="t">덤 (백에게)</label>
      <div class="seg">
        <label><input type="radio" name="komi" value="0.5"><span>0.5</span></label>
        <label><input type="radio" name="komi" value="6.5"><span>6.5</span></label>
        <label><input type="radio" name="komi" value="7.5"><span>7.5</span></label>
      </div>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" name="coords"> 좌표 표시</label>
      <label class="check"><input type="checkbox" name="confirm"> 터치할 때 두 번 탭해서 착수 (실수 방지)</label>
    </div>
    <div class="row2">
      <button value="cancel" type="submit">취소</button>
      <button value="ok" type="submit" class="primary">시작</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<!-- ===================== 엔진 (규칙 + AI) ===================== -->
<!-- 이 스크립트는 메인 화면과 Web Worker 양쪽에서 그대로 사용됩니다. -->
<script id="engine">
var Go = (function () {
  'use strict';

  /* ---------- 판 기하 정보 ---------- */
  function Geom(n) {
    this.n = n; this.size = n * n;
    this.nb = new Array(this.size); this.dg = new Array(this.size);
    this.line = new Int8Array(this.size);
    for (var i = 0; i < this.size; i++) {
      var x = i % n, y = (i / n) | 0, a = [], d = [];
      if (x > 0) a.push(i - 1); if (x < n - 1) a.push(i + 1);
      if (y > 0) a.push(i - n); if (y < n - 1) a.push(i + n);
      if (x > 0 && y > 0) d.push(i - n - 1); if (x < n - 1 && y > 0) d.push(i - n + 1);
      if (x > 0 && y < n - 1) d.push(i + n - 1); if (x < n - 1 && y < n - 1) d.push(i + n + 1);
      this.nb[i] = a; this.dg[i] = d;
      this.line[i] = Math.min(x, y, n - 1 - x, n - 1 - y) + 1;
    }
    this.mark = new Int32Array(this.size); this.lmark = new Int32Array(this.size); this.stamp = 0;
    this.stones = new Int32Array(this.size); this.cnt = 0; this.libs = 0; this.lastLib = -1;
    this.buf = new Int32Array(this.size);
  }
  var geoms = {};
  function geom(n) { return geoms[n] || (geoms[n] = new Geom(n)); }

  /* ---------- 국면 ---------- */
  function Pos(n) { this.n = n; this.cells = new Int8Array(n * n); this.ko = -1; this.toPlay = 1; }
  Pos.prototype.clone = function () {
    var p = new Pos(this.n); p.cells.set(this.cells); p.ko = this.ko; p.toPlay = this.toPlay; return p;
  };

  /* 그룹 정보: 돌 목록(g.stones[0..cnt)), 활로 수. maxLibs>0 이면 그 수에 도달하는 즉시 중단 */
  function groupInfo(g, cells, pt, maxLibs) {
    var color = cells[pt], st = ++g.stamp, stones = g.stones, mark = g.mark, lmark = g.lmark;
    var cnt = 0, libs = 0, lastLib = -1, i = 0;
    mark[pt] = st; stones[cnt++] = pt;
    while (i < cnt) {
      var nb = g.nb[stones[i++]];
      for (var k = 0; k < nb.length; k++) {
        var q = nb[k], c = cells[q];
        if (c === 0) {
          if (lmark[q] !== st) {
            lmark[q] = st; libs++; lastLib = q;
            if (maxLibs && libs >= maxLibs) { g.cnt = cnt; g.libs = libs; g.lastLib = lastLib; return libs; }
          }
        } else if (c === color && mark[q] !== st) { mark[q] = st; stones[cnt++] = q; }
      }
    }
    g.cnt = cnt; g.libs = libs; g.lastLib = lastLib; return libs;
  }

  function isLegal(g, pos, pt) {
    var cells = pos.cells;
    if (cells[pt] !== 0 || pt === pos.ko) return false;
    var me = pos.toPlay, op = 3 - me, nb = g.nb[pt], k;
    for (k = 0; k < nb.length; k++) if (cells[nb[k]] === 0) return true;
    cells[pt] = me;
    var ok = false;
    for (k = 0; k < nb.length; k++) {
      var c = cells[nb[k]];
      if (c === op) { if (groupInfo(g, cells, nb[k], 1) === 0) { ok = true; break; } }
      else if (c === me) { if (groupInfo(g, cells, nb[k], 1) > 0) { ok = true; break; } }
    }
    cells[pt] = 0;
    return ok;
  }

  function legality(g, pos, pt) {
    if (pos.cells[pt] !== 0) return 'occupied';
    if (pt === pos.ko) return 'ko';
    return isLegal(g, pos, pt) ? 'ok' : 'suicide';
  }

  /* 착수. pt<0 은 패스. 반환: 따낸 돌 수, 불법이면 -1 */
  function play(g, pos, pt) {
    var me = pos.toPlay, op = 3 - me;
    if (pt < 0) { pos.ko = -1; pos.toPlay = op; return 0; }
    if (!isLegal(g, pos, pt)) return -1;
    var cells = pos.cells, nb = g.nb[pt], captured = 0, capPt = -1;
    cells[pt] = me;
    for (var k = 0; k < nb.length; k++) {
      var q = nb[k];
      if (cells[q] === op && groupInfo(g, cells, q, 1) === 0) {
        for (var i = 0; i < g.cnt; i++) cells[g.stones[i]] = 0;
        captured += g.cnt; capPt = q;
      }
    }
    pos.ko = -1;
    if (captured === 1) {
      groupInfo(g, cells, pt, 0);
      if (g.cnt === 1 && g.libs === 1) pos.ko = capPt;
    }
    pos.toPlay = op;
    return captured;
  }

  /* 자기 눈인지 (메우면 손해인 자리) */
  function isEye(g, cells, pt, color) {
    var nb = g.nb[pt], k;
    for (k = 0; k < nb.length; k++) if (cells[nb[k]] !== color) return false;
    var dg = g.dg[pt], bad = 0, op = 3 - color;
    for (k = 0; k < dg.length; k++) if (cells[dg[k]] === op) bad++;
    return nb.length < 4 ? bad === 0 : bad <= 1;
  }

  /* minStones 이상 크기의 그룹이 자충(단수)이 되는 수인지 */
  function selfAtari(g, pos, pt, minStones) {
    var cells = pos.cells, me = pos.toPlay, op = 3 - me, nb = g.nb[pt], emp = 0, k;
    for (k = 0; k < nb.length; k++) if (cells[nb[k]] === 0) emp++;
    if (emp >= 2) return false;
    cells[pt] = me;
    var res = false, cap = false;
    for (k = 0; k < nb.length; k++) {
      if (cells[nb[k]] === op && groupInfo(g, cells, nb[k], 1) === 0) { cap = true; break; }
    }
    if (!cap) { var l = groupInfo(g, cells, pt, 2); if (l <= 1 && g.cnt >= minStones) res = true; }
    cells[pt] = 0;
    return res;
  }

  function genMoves(g, pos) {
    var out = [], cells = pos.cells, me = pos.toPlay;
    for (var i = 0; i < g.size; i++) {
      if (cells[i] === 0 && !isEye(g, cells, i, me) && isLegal(g, pos, i)) out.push(i);
    }
    return out;
  }

  /* 휴리스틱 평가 (보통 난이도 + 탐색의 사전 지식) */
  function evalMove(g, pos, pt, last, moveNum) {
    var cells = pos.cells, me = pos.toPlay, op = 3 - me, nb = g.nb[pt], n = g.n;
    var s = 0, capture = 0, saved = 0, k, l;
    for (k = 0; k < nb.length; k++) {
      var q = nb[k], c = cells[q];
      if (c === op) { l = groupInfo(g, cells, q, 3); if (l === 1) capture += g.cnt; else if (l === 2) s += 0.8; }
      else if (c === me) { l = groupInfo(g, cells, q, 2); if (l === 1) saved += g.cnt; }
    }
    cells[pt] = me;
    var libsAfter = groupInfo(g, cells, pt, 4), myCnt = g.cnt;
    cells[pt] = 0;
    if (capture > 0) s += 4 + capture * 3;
    if (saved > 0) {
      if (libsAfter >= 3 || capture > 0) s += 4 + saved * 2;
      else if (libsAfter === 2) s += 1 + saved * 0.5;
      else s -= 1;
    }
    if (libsAfter === 1 && capture === 0) s -= 3 + myCnt * 1.5;
    else if (libsAfter === 2 && capture === 0 && myCnt > 3) s -= 0.5;

    var line = g.line[pt], early = moveNum < g.size * 0.12;
    if (line === 1) s -= (capture || saved) ? 0 : 2.5;
    else if (line === 2) s -= early ? 1 : 0.2;
    else if (early && (line === 3 || line === 4)) s += 1;

    var x = pt % n, y = (pt / n) | 0;
    if (last >= 0) {
      var d = Math.abs(last % n - x) + Math.abs(((last / n) | 0) - y);
      if (d <= 2) s += 0.6;
    }
    if (early && n >= 13) {
      var near = 0;
      for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) {
        var xx = x + dx, yy = y + dy;
        if (xx >= 0 && yy >= 0 && xx < n && yy < n && cells[yy * n + xx]) near++;
      }
      if (near === 0) s += 0.8;
    }
    return s;
  }

  /* 플레이아웃용 전술 수: 단수된 직전 수 따내기 / 단수된 내 돌 살리기 */
  function tactical(g, pos, last) {
    var cells = pos.cells, me = pos.toPlay, op = 3 - me, l, lib;
    if (cells[last] === op) {
      l = groupInfo(g, cells, last, 2);
      if (l === 1) { lib = g.lastLib; if (isLegal(g, pos, lib)) return lib; }
    }
    var nb = g.nb[last];
    for (var k = 0; k < nb.length; k++) {
      var q = nb[k];
      if (cells[q] === me && groupInfo(g, cells, q, 2) === 1) {
        lib = g.lastLib;
        if (isLegal(g, pos, lib)) {
          cells[lib] = me; var after = groupInfo(g, cells, lib, 3); cells[lib] = 0;
          if (after >= 2) return lib;
        }
      }
    }
    return -1;
  }

  /* 계가(집 + 돌, 중국식) : 흑 - 백 - 덤. own 배열이 있으면 소유 누적 */
  function areaScore(g, cells, komi, own) {
    var s = 0;
    for (var i = 0; i < g.size; i++) {
      var c = cells[i], o = 0;
      if (c === 1) o = 1; else if (c === 2) o = -1;
      else {
        var nb = g.nb[i], b = 0, w = 0;
        for (var k = 0; k < nb.length; k++) { var cc = cells[nb[k]]; if (cc === 1) b = 1; else if (cc === 2) w = 1; }
        if (b && !w) o = 1; else if (w && !b) o = -1;
      }
      s += o; if (own) own[i] += o;
    }
    return s - komi;
  }

  function playout(g, p, firstCol, firstIdx, idx, last, passes, maxMoves) {
    var cells = p.cells, size = g.size, buf = g.buf, moves = 0;
    while (passes < 2 && moves < maxMoves) {
      var me = p.toPlay, mv = -1;
      if (last >= 0) mv = tactical(g, p, last);
      if (mv < 0) {
        var k = 0;
        for (var i = 0; i < size; i++) if (cells[i] === 0) buf[k++] = i;
        while (k > 0) {
          var r = (Math.random() * k) | 0, pt = buf[r];
          buf[r] = buf[--k];
          if (isEye(g, cells, pt, me)) continue;
          if (!isLegal(g, p, pt)) continue;
          if (selfAtari(g, p, pt, 2)) continue;
          mv = pt; break;
        }
      }
      if (mv < 0) { play(g, p, -1); passes++; last = -1; }
      else {
        play(g, p, mv); passes = 0; last = mv;
        if (!firstCol[mv]) { firstCol[mv] = me; firstIdx[mv] = idx; }
      }
      idx++; moves++;
    }
  }

  /* ---------- MCTS (UCT + RAVE + 휴리스틱 사전지식) ---------- */
  var PRIOR_N = 10, EXPL = 0.2, RAVE_B = 1 / 2000;
  function Node(move, color) {
    this.move = move; this.color = color; this.children = null;
    this.N = 0; this.W = 0; this.pN = 0; this.pW = 0; this.v = 0; this.rN = 0; this.rW = 0;
  }
  function expand(g, p, node, last, moveNum) {
    var moves = genMoves(g, p), me = p.toPlay, ch = [];
    for (var i = 0; i < moves.length; i++) {
      var c = new Node(moves[i], me), e = evalMove(g, p, moves[i], last, moveNum);
      var q = 0.5 + e * 0.05; if (q < 0.05) q = 0.05; if (q > 0.95) q = 0.95;
      c.N = c.pN = PRIOR_N; c.W = c.pW = PRIOR_N * q; ch.push(c);
    }
    if (!ch.length) { var pc = new Node(-1, me); pc.N = pc.pN = 1; pc.W = pc.pW = 0.5; ch.push(pc); }
    node.children = ch;
  }
  function select(node) {
    var best = null, bv = -1e9, lg = Math.log(node.N + 1), ch = node.children;
    for (var i = 0; i < ch.length; i++) {
      var c = ch[i], q = c.W / c.N, v;

      ctx.font = '600 ' + Math.max(9, cell * 0.36) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var o = margin * 0.5;
      for (i = 0; i < n; i++) {
        ctx.fillText(LETTERS[i], px(i), o); ctx.fillText(LETTERS[i], px(i), W - o);
        ctx.fillText(String(n - i), o, px(i)); ctx.fillText(String(n - i), W - o, px(i));
      }
    }
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var pt = y * n + x, c = cells[pt];
      if (c) drawStone(px(x), px(y), c, S.dead.has(pt) && (S.scoring || S.over) ? 0.45 : 1);
    }
    if (S.territory && (S.scoring || S.over)) {
      var sq = cell * 0.32;
      for (pt = 0; pt < n * n; pt++) {
        var t = S.territory[pt]; if (!t) continue;
        ctx.fillStyle = t === 1 ? '#111' : '#fafafa';
        ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1;
        ctx.fillRect(px(pt % n) - sq / 2, px((pt / n) | 0) - sq / 2, sq, sq);
        if (t === 2) ctx.strokeRect(px(pt % n) - sq / 2, px((pt / n) | 0) - sq / 2, sq, sq);
      }
    }
    if (S.last >= 0 && !S.scoring) {
      var lc = cells[S.last];
      ctx.strokeStyle = lc === 1 ? '#fff' : '#111'; ctx.lineWidth = Math.max(1.5, cell * 0.07);
      ctx.beginPath(); ctx.arc(px(S.last % n), px((S.last / n) | 0), cell * 0.22, 0, Math.PI * 2); ctx.stroke();
    }
    var ghost = pending >= 0 ? pending : hover;
    if (ghost >= 0 && !S.over && !S.scoring && !S.thinking && !isAITurn() && cells[ghost] === 0) {
      drawStone(px(ghost % n), px((ghost / n) | 0), S.pos.toPlay, pending >= 0 ? 0.7 : 0.4);
      if (pending >= 0) {
        ctx.strokeStyle = '#d0451b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px(ghost % n), px((ghost / n) | 0), cell * 0.5, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  function ptFromEvent(e) {
    var r = canvas.getBoundingClientRect(), n = S.n;
    var i = Math.round((e.clientX - r.left - margin) / cell), j = Math.round((e.clientY - r.top - margin) / cell);
    if (i < 0 || j < 0 || i >= n || j >= n) return -1;
    return j * n + i;
  }

  var toastTimer = null;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------- 이벤트 ---------- */
  canvas.addEventListener('pointerup', function (e) {
    if (!S) return;
    var pt = ptFromEvent(e); if (pt < 0) return;
    if (S.scoring) { toggleDead(pt); return; }
    if (S.over || S.thinking || isAITurn()) return;
    var needConfirm = cfg.confirm && e.pointerType !== 'mouse';
    if (needConfirm && pending !== pt) {
      if (S.pos.cells[pt] !== 0) return;
      pending = pt; draw(); return;
    }
    humanPlay(pt);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!S || e.pointerType !== 'mouse') return;
    var pt = ptFromEvent(e); if (pt !== hover) { hover = pt; draw(); }
  });
  canvas.addEventListener('pointerleave', function () { if (hover !== -1) { hover = -1; draw(); } });

  $('btnPass').onclick = function () {
    if (!S || S.over || S.scoring || S.thinking || isAITurn()) return;
    pending = -1;
    if (!doPass()) { updateUI(); draw(); maybeAI(); }
  };
  $('btnUndo').onclick = undo;
  $('btnResign').onclick = resign;
  $('btnConfirm').onclick = confirmScore;
  $('btnResume').onclick = resumePlay;

  var dlg = $('dlg'), form = $('cfgForm');
  function syncDlg() {
    var pvp = form.mode.value === 'pvp';
    form.querySelectorAll('#fLevel input, #fColor input').forEach(function (el) { el.disabled = pvp; });
  }
  function openSettings() {
    form.mode.value = cfg.mode; form.level.value = cfg.level; form.human.value = String(cfg.human);
    form.n.value = String(cfg.n); form.komi.value = String(cfg.komi);
    form.coords.checked = cfg.coords; form.confirm.checked = cfg.confirm;
    syncDlg();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  form.addEventListener('change', syncDlg);
  dlg.addEventListener('close', function () {
    if (dlg.returnValue !== 'ok') return;
    cfg.mode = form.mode.value; cfg.level = form.level.value; cfg.human = +form.human.value;
    cfg.n = +form.n.value; cfg.komi = +form.komi.value;
    cfg.coords = form.coords.checked; cfg.confirm = form.confirm.checked;
    saveCfg(); newGame();
  });
  $('btnSettings').onclick = openSettings;
  $('btnNew').onclick = openSettings;

  window.addEventListener('resize', function () { resize(); });
  newGame();
})();
</script>
</body>
</html>
